# Product Catalog Service
# Custom Go microservice
# Deploy AFTER all dependencies!
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-catalog
  namespace: otel-demo
  labels:
    app: product-catalog
    version: v1
    language: go
    environment: production
    team: platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: product-catalog
  template:
    metadata:
      labels:
        app: product-catalog
        version: v1
    spec:
      containers:
      - name: product-catalog
        image: YOUR_REGISTRY/product-catalog:v1
        ports:
        - containerPort: 3550
        env:
        - name: PRODUCT_CATALOG_PORT
          value: "3550"
        - name: FLAGD_HOST
          value: "flagd"
        - name: FLAGD_PORT
          value: "8013"
        - name: DB_CONNECTION_STRING
          value: "postgres://astronomy_user:astronomy_pass@postgres.otel-demo:5432/astronomy_db?sslmode=disable"
        - name: OTEL_SERVICE_NAME
          value: "product-catalog"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://otel-collector:4317"
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        livenessProbe:
          grpc:
            port: 3550
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          grpc:
            port: 3550
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: product-catalog
  namespace: otel-demo
  labels:
    app: product-catalog
spec:
  selector:
    app: product-catalog
  ports:
  - port: 3550
    targetPort: 3550
